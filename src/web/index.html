<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sandbox</title>
  
  <!-- Single Page Stylesheet Entry Point -->
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="app-viewport">

  <!-- Splash Screen Rendered Dynamically from Config -->
  <section id="engineSplash" class="splash-layer" aria-hidden="true">
    <div class="splash-content">
      <h1 class="splash-brand-text">Sandbox</h1>
      <p class="splash-sub-text">Workspace</p>
    </div>
  </section>

  <!-- Master Host Shell (Assembled Dynamically by Section Controllers) -->
  <div id="appRoot" class="engine-shell is-hidden"></div>

  <!-- Single Page Script Entry Point -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
