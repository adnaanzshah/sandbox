<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sandbox</title>

  <script>
    (function() {
      var isDebug = localStorage.getItem('sb_debug_splash') === 'true';
      var hasSeen = sessionStorage.getItem('sb_splash_seen') === 'true';
      if (hasSeen && !isDebug) {
        document.documentElement.classList.add('splash-bypassed');
      }
    })();
  </script>

  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/splash.css" />
  <link rel="stylesheet" href="/css/pages/home-page.css" />
</head>
<body class="app-viewport">

  <!-- Splash Screen -->
  <section id="engineSplash" class="splash-layer" aria-hidden="true">
    <div class="splash-content">
      <h1 class="splash-brand-text">Sandbox</h1>
      <p class="splash-sub-text">System Workspace</p>
    </div>
  </section>

  <!-- Apple iOS Liquid Glass Auth Vault -->
  <div id="authOverlay" class="auth-lock-overlay is-hidden">
    <div class="auth-vault-card">
      <div class="auth-glyph-orb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="4" ry="4"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h2 class="auth-vault-title">Sandbox Core</h2>
      <p class="auth-vault-subtitle">Restricted Access • Authenticate Identity</p>

      <form id="authForm" class="auth-form-body">
        <div class="auth-grouped-cells">
          <div class="auth-cell">
            <input type="text" id="authUsername" class="auth-input-glass" placeholder="Username" autocomplete="username" required />
          </div>
          <div class="auth-cell">
            <input type="password" id="authPassword" class="auth-input-glass" placeholder="Password" autocomplete="current-password" required />
          </div>
        </div>

        <button type="submit" id="authSubmitBtn" class="auth-action-btn">Unlock Session</button>
        <div id="authErrorMsg" class="auth-error-chip"></div>
      </form>
    </div>
  </div>

  <!-- Continuous Single-Plane Canvas Shell -->
  <div id="appShell" class="page-root-shell"></div>

  <script>
    setTimeout(function() {
      var splash = document.getElementById('engineSplash');
      if (splash && !splash.classList.contains('is-dismissed')) {
        splash.classList.add('is-dismissed');
        splash.style.setProperty('display', 'none', 'important');
      }
      var isDebug = localStorage.getItem('sb_debug_splash') === 'true';
      if (!isDebug) sessionStorage.setItem('sb_splash_seen', 'true');
    }, 850);
  </script>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
